version: '3.8'

services:
  # ==========================================
  # 1. Base de datos PostgreSQL con Volumen
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red-laboratorio

  # ==========================================
  # 2. Copia 1 de la API (Build local)
  # ==========================================
  api-1:
    build: ./api
    container_name: api-instancia-1
    restart: always
    environment:
      - MESSAGE=${MESSAGE}
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - red-laboratorio

  # ==========================================
  # 3. Copia 2 de la API (Build local)
  # ==========================================
  api-2:
    build: ./api
    container_name: api-instancia-2
    restart: always
    environment:
      - MESSAGE=${MESSAGE}
      - PORT=3000
    ports:
      - "3001:3000"
    depends_on:
      - db
    networks:
      - red-laboratorio

  # ==========================================
  # 4. Copia 3 de la API (Build local)
  # ==========================================
  api-3:
    build: ./api
    container_name: api-instancia-3
    restart: always
    environment:
      - MESSAGE=${MESSAGE}
      - PORT=3000
    ports:
      - "3002:3000"
    depends_on:
      - db
    networks:
      - red-laboratorio

# ==========================================
# Definición de Volúmenes Persistentes
# ==========================================
volumes:
  postgres_data:
    driver: local

# ==========================================
# Definición de Redes Personalizadas
# ==========================================
networks:
  red-laboratorio:
    driver: bridge